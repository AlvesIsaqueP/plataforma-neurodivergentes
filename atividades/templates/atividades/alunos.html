{% extends "base.html" %}
{% block titulo %}Alunos{% endblock %}
{% block conteudo %}
<h1>Alunos</h1>
<p class="suave">Escolha um aluno para ver as notas.</p>
<ul class="grade-materias">
    {% for a in alunos %}
    <li>
        <a class="cartao cartao-materia" href="{% url 'aluno' a.pk %}">
            <span class="inicial" aria-hidden="true">{{ a.nome|first }}</span>
            <span class="nome-materia">{{ a.nome }}</span>
        </a>
    </li>
    {% empty %}
    <li class="cartao">Nenhum aluno cadastrado ainda.</li>
    {% endfor %}
</ul>
{% endblock %}
