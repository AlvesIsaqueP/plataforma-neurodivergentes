{% extends "base.html" %}
{% load static %}

{% block titulo %}Entrar{% endblock %}

{% block conteudo %}
<section class="cartao cartao-login">
    <img src="{% static 'img/logo-varius.png' %}" alt="Varius: educação inclusiva para crianças e adolescentes neurodivergentes" class="logo-login">
    <h1>Entrar</h1> 
    <p class="suave">Acesso para professores e responsáveis.</p>

    {% if form.errors %}
    <div class="alerta" role="alert">
        Usuário ou senha incorretos. Confira os dados e tente de novo.
    </div>
    {% endif %}

    <form method="post">
        {% csrf_token %}
        <div class="campo">
            <label for="id_username">Usuário</label>
            <input type="text" name="username" id="id_username" autocomplete="username" required>
        </div>
        <div class="campo">
            <label for="id_password">Senha</label>
            <input type="password" name="password" id="id_password" autocomplete="current-password" required>
        </div>
        <button type="submit" class="botao">Entrar</button>
    </form>
</section>
{% endblock %}
