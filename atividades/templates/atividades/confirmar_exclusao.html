{% extends "base.html" %}
{% block titulo %}Confirmar exclusão{% endblock %}
{% block conteudo %}
<h1>{{ titulo }}</h1>
<div class="aviso-exclusao" role="alert">
    <ul class="lista-simples">
        {% for a in avisos %}<li>{{ a }}</li>{% endfor %}
    </ul>
</div>
<form method="post" class="acoes-pagina">
    {% csrf_token %}
    <button type="submit" class="botao-perigo">Sim, excluir</button>
    <a class="botao-pequeno" href="{{ cancelar }}">Cancelar</a>
</form>
{% endblock %}
